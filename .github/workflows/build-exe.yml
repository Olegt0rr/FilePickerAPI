name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # теги нужны setuptools-scm для версии
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run ruff checks
      run: |
        ruff check app tests
        ruff format --check app tests
    
    - name: Run tests with coverage
      run: |
        pytest
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7

  build:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # теги нужны setuptools-scm для версии
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[build]

    # Кэш Nuitka (скомпилированные C-модули, скачанные утилиты): без него
    # каждый push/PR заново компилирует всё дерево зависимостей.
    - name: Cache Nuitka
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Nuitka\Nuitka\Cache
        # Ключ уникален для коммита: actions/cache не перезаписывает
        # существующий ключ, а restore-keys подхватит предыдущий кэш.
        key: nuitka-${{ runner.os }}-${{ github.sha }}
        restore-keys: nuitka-${{ runner.os }}-

    - name: Build executable with Nuitka
      shell: pwsh
      run: |
        # Версию вычисляет setuptools-scm из git-тега при pip install.
        # Для свойств exe нужны только цифры: 2.3.1.dev4+g1a2b3c4 -> 2.3.1.
        $fullVersion = python -c "from app._version import version; print(version)"
        $version = python -c "from app._version import version_tuple as v; print('.'.join(str(p) for p in v[:3]))"
        if ($LASTEXITCODE -or -not $version) { exit 1 }
        if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$fullVersion") {
          Write-Output "::error::Tag $env:GITHUB_REF_NAME resolved to version $fullVersion"
          exit 1
        }
        Write-Output "Building version $fullVersion (file version $version)"
        python -m nuitka `
          --mode=standalone `
          --msvc=latest `
          --assume-yes-for-downloads `
          --remove-output `
          --output-dir=build `
          --output-folder-name=FilePickerAPI `
          --output-filename=FilePickerAPI.exe `
          --include-package=app `
          --include-package=uvicorn `
          --product-name=FilePickerAPI `
          --file-description="File Picker API" `
          --file-version=$version `
          --product-version=$version `
          app/__main__.py
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force dist | Out-Null
        Move-Item build/FilePickerAPI.dist dist/FilePickerAPI
        Copy-Item run_test.bat, run_production.bat dist/FilePickerAPI/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FilePickerAPI-Windows
        path: dist/
        retention-days: 30
