name: Build and Test

# Коммиты и PR, где изменена только документация (*.md, OpenSpec и
# openspec для его проверки, инструкции агентов в .claude), тесты и
# сборку не запускают: код и exe от них не меняются; для них есть
# лёгкая проверка docs.yml. Если вместе с ними изменён любой другой
# файл, workflow запускается целиком. Список одинаков в audit.yml и
# docs.yml, это проверяет tests/test_workflows.py.
on:
  push:
    branches: [ main, master ]
    paths-ignore: &docs-only
      - '**.md'
      - 'openspec/**'
      - '.claude/**'
      - '.github/openspec/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore: *docs-only
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # теги нужны setuptools-scm для версии
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run ruff checks
      run: |
        ruff check app tests scripts
        ruff format --check app tests scripts
    
    # Список филиалов для матрицы сборки. Вывод сохраняем в переменную
    # до echo: иначе ошибка в branches.toml потерялась бы в подстановке.
    - name: Read branch list from branches.toml
      id: matrix
      run: |
        matrix="$(python scripts/branches.py matrix)"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
    
    - name: Run tests with coverage
      run: |
        pytest
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7

  # Сервис работает на Windows: проверки UNC-путей, обратного слэша,
  # недопустимых имён и времени создания файла на Linux не выполняются
  # (там это тесты с пометкой skipif). Раннер работает с правами
  # администратора, поэтому тесты с символическими ссылками и UNC-путём
  # (через административный ресурс диска) здесь не пропускаются, а
  # падают, если ссылку или ресурс не удалось получить.
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # теги нужны setuptools-scm для версии

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .[dev]

    # Отдельный SMB-ресурс этого же раннера для тестов сетевой папки
    # (TestSmbShare): скачивание по UNC, отказ в доступе, пропажа и
    # возврат ресурса. Тесты сами убирают и создают его заново с теми же
    # параметрами (SMB_SHARE_CREATE в tests/test_main.py)
    - name: Create SMB share for network tests
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'smb-share'
        New-Item -ItemType Directory -Force $dir | Out-Null
        $user = [Security.Principal.WindowsIdentity]::GetCurrent().Name
        New-SmbShare -Name FilePickerApiTest -Path $dir -FullAccess $user | Out-Null
        "SMB_TEST_SHARE=FilePickerApiTest" >> $env:GITHUB_ENV
        "SMB_TEST_SHARE_DIR=$dir" >> $env:GITHUB_ENV

    - name: Run tests
      env:
        REQUIRE_SYMLINKS: '1'
        REQUIRE_UNC_SHARE: '1'
      run: |
        pytest

  # Отдельная сборка под каждый филиал из branches.toml: код один и тот
  # же, отличается только зашитая директория с файлами.
  build:
    name: build (${{ matrix.name }})
    runs-on: windows-latest
    needs: [test, test-windows]
    # Обычно 5–9 минут. Срок шага (timeout-minutes у «MSI smoke test»)
    # соблюдает сам раннер: если он перестал отвечать, шаг висит до
    # отмены вручную (прогон 43027367514). Срок джоба отменяет GitHub
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.matrix) }}
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # теги нужны setuptools-scm для версии
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    # setuptools и wheel обновляем так же, как в audit.yml: иначе в
    # сборке остался бы setuptools из Python 3.11, а аудит проверял бы
    # уже обновлённый.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .[build]

    - name: Configure files directory for branch ${{ matrix.name }}
      env:
        BRANCH_NAME: ${{ matrix.name }}
      run: |
        python scripts/branches.py configure "$env:BRANCH_NAME"

    - name: Verify files directory for branch ${{ matrix.name }}
      shell: python
      env:
        EXPECTED_DIRECTORY: ${{ matrix.files_directory }}
      run: |
        import os
        import runpy

        # Читаем сгенерированный файл через runpy, а не импортом app:
        # так проверяется ровно этот файл, без импорта пакета.
        actual = runpy.run_path("app/_build_config.py")["FILES_DIRECTORY"]
        expected = os.environ["EXPECTED_DIRECTORY"]
        print("files_directory =", actual)
        assert actual == expected, f"expected {expected!r}, got {actual!r}"

    # Кэш Nuitka (скомпилированные C-модули, скачанные утилиты): без него
    # каждый push/PR заново компилирует всё дерево зависимостей.
    # Релизная сборка (по тегу) идёт на подпись, поэтому собирается с нуля,
    # без объектов из кэша других запусков; кэш тега к тому же никто
    # не переиспользует.
    - name: Cache Nuitka
      if: github.ref_type != 'tag'
      uses: actions/cache@v6
      with:
        path: ~\AppData\Local\Nuitka\Nuitka\Cache
        # Ключ уникален для коммита: actions/cache не перезаписывает
        # существующий ключ, а restore-keys подхватит предыдущий кэш.
        # Один ключ на все филиалы: сборки отличаются только
        # app._build_config, поэтому сохраняет кэш первый завершившийся
        # джоб, а не каждый филиал свою почти одинаковую копию.
        key: nuitka-${{ runner.os }}-${{ github.sha }}
        restore-keys: nuitka-${{ runner.os }}-

    - name: Build executable with Nuitka
      shell: pwsh
      run: |
        # Версию вычисляет setuptools-scm из git-тега при pip install.
        # Для свойств exe нужны только ведущие числа (не больше трёх):
        # 2.3.1.dev4+g1a2b3c4 -> 2.3.1, 0.1.dev4+g1a2b3c4 (нет тегов) -> 0.1.
        # Файл читаем через runpy, а не импортом: так читается ровно
        # app/_version.py, без импорта пакета.
        $out = python -c "import runpy; from itertools import takewhile; ns = runpy.run_path('app/_version.py'); v = ns['version_tuple']; print(ns['version']); print('.'.join(str(p) for p in takewhile(lambda p: isinstance(p, int), v[:3])))"
        if ($LASTEXITCODE -or @($out).Count -ne 2 -or -not $out[1]) { exit 1 }
        $fullVersion, $version = $out
        if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$fullVersion") {
          Write-Output "::error::Tag $env:GITHUB_REF_NAME resolved to version $fullVersion"
          exit 1
        }
        Write-Output "Building version $fullVersion (file version $version)"
        # Та же версия — у DLL сообщений (следующий шаг); полная версия
        # нужна дымовой проверке MSI (/openapi.json и событие 1000)
        "FILE_VERSION=$version" >> $env:GITHUB_ENV
        "APP_VERSION=$fullVersion" >> $env:GITHUB_ENV
        # attach: запущенный из cmd или PowerShell exe пишет журнал в эту
        # консоль и останавливается по Ctrl+C, а запущенный при входе,
        # двойным щелчком или run_production.bat работает без окна
        python -m nuitka `
          --mode=standalone `
          --windows-console-mode=attach `
          --msvc=latest `
          --assume-yes-for-downloads `
          --remove-output `
          --output-dir=build `
          --output-folder-name=FilePickerAPI `
          --output-filename=FilePickerAPI.exe `
          --include-package=app `
          --include-module=app._build_config `
          --include-package=uvicorn `
          --include-module=win32timezone `
          --product-name=FilePickerAPI `
          --file-description="File Picker API" `
          --file-version=$version `
          --product-version=$version `
          app/__main__.py
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force dist | Out-Null
        Move-Item build/FilePickerAPI.dist dist/FilePickerAPI
        Copy-Item run_test.bat, run_production.bat dist/FilePickerAPI/

    # Ресурсная DLL с таблицей сообщений журнала событий: на неё указывает
    # EventMessageFile источника FilePickerAPI, без неё Event Viewer
    # пишет «Не найдено описание». VERSIONINFO нужен, чтобы Windows
    # Installer заменял DLL при обновлении по версии. mc, rc и link — из
    # того же MSVC, что у Nuitka
    - name: Build event message DLL
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) {
          Write-Output "::error::MSVC not found"
          exit 1
        }
        $out = 'build\messages'
        New-Item -ItemType Directory -Force $out | Out-Null
        # 2.3.1 -> 2,3,1,0; 0.1 -> 0,1,0,0
        $fileVersion = (@($env:FILE_VERSION.Split('.')) + @('0', '0', '0') | Select-Object -First 4) -join ','
        $rc = Get-Content app\messages\FilePickerAPI.version.rc -Raw
        $rc = $rc.Replace('@FILEVERSION@', $fileVersion).Replace('@VERSION@', $env:FILE_VERSION)
        # ascii: rc читает файл в кодовой странице ANSI; кириллица
        # комментариев шаблона становится «?», на ресурсы это не влияет
        Set-Content "$out\version.rc" $rc -Encoding ascii
        cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && mc -U -h $out -r $out app\messages\FilePickerAPI.mc && rc /nologo /fo $out\FilePickerAPI.res $out\version.rc && link /nologo /DLL /NOENTRY /MACHINE:X64 /OUT:$out\FilePickerAPI.messages.dll $out\FilePickerAPI.res"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $dll = Get-Item "$out\FilePickerAPI.messages.dll"
        if ($dll.VersionInfo.FileVersion -ne $env:FILE_VERSION) {
          Write-Output "::error::Message DLL version is '$($dll.VersionInfo.FileVersion)', expected '$env:FILE_VERSION'"
          exit 1
        }
        Copy-Item $dll dist/FilePickerAPI/

    # Новая сборка работает с прежними bat-скриптами, принимает только
    # запуск без аргументов и читает .env из своей папки. Проверяется
    # копия сборки: созданный проверкой .env не должен попасть в архив.
    # Сборки филиалов отличаются только app._build_config, поэтому
    # достаточно проверить одну
    - name: Check startup scripts and arguments
      if: strategy.job-index == 0
      shell: pwsh
      run: ./.github/scripts/startup-smoke.ps1 dist/FilePickerAPI

    # Дымовая проверка MSI (design.md, «Тесты без Windows и проверка на
    # Windows в CI»), как и проверка выше, — на одном филиале. Две копии
    # папки сборки вне dist/: как есть и с версией на единицу больше в
    # ресурсах exe и DLL сообщений (для проверки обновления). Ресурсы
    # правятся до подписи: правка сделала бы подпись недействительной,
    # а sign.ps1 на этом останавливается. Версия приложения в app._version
    # у копии та же, поэтому MSI различаются по SHA-256 и FILEVERSION.
    # dist/ и артефакт остаются неподписанными: на файлах с одноразовой
    # подписью боевой sign.ps1 остановил бы релиз
    - name: Make build copies for MSI smoke test
      if: strategy.job-index == 0
      shell: pwsh
      run: |
        $version1 = python scripts/msi_version.py $env:APP_VERSION
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $version2 = python scripts/msi_version.py next $env:APP_VERSION
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        # Проверка сверяет FILEVERSION exe с версией первого MSI
        if ($version1 -ne $env:FILE_VERSION) {
          Write-Output "::error::MSI version $version1 differs from file version $env:FILE_VERSION"
          exit 1
        }
        $root = Join-Path $env:RUNNER_TEMP 'msi-smoke'
        Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
        New-Item -ItemType Directory "$root\builds" | Out-Null
        Copy-Item -Recurse dist/FilePickerAPI "$root\builds\first"
        Copy-Item -Recurse dist/FilePickerAPI "$root\builds\second"
        foreach ($file in 'FilePickerAPI.exe', 'FilePickerAPI.messages.dll') {
          python scripts/set_file_version.py "$root\builds\second\$file" $version2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
        "MSI_SMOKE=$root" >> $env:GITHUB_ENV
        "MSI_VERSION_1=$version1" >> $env:GITHUB_ENV
        "MSI_VERSION_2=$version2" >> $env:GITHUB_ENV

    # Одноразовый сертификат, как в sign-smoke: копии подписываются, из
    # них собираются MSI, MSI подписываются тем же сертификатом. Один шаг,
    # чтобы ключ не попал в GITHUB_ENV. Второй MSI собирается дважды:
    # заново собранный (другой ProductCode) поверх второго ставиться не
    # должен. Сборка MSI — тем же скриптом, что в release.yml
    - name: Build and sign smoke-test MSI packages
      if: strategy.job-index == 0
      shell: pwsh
      env:
        TIMESTAMP_URL: http://timestamp.digicert.com
        BRANCH_NAME: ${{ matrix.name }}
      run: |
        ./.github/scripts/throwaway-cert.ps1 -Subject 'CN=FilePickerAPI CI MSI smoke test'

        $builds = "$env:MSI_SMOKE\builds"
        $packages = "$env:MSI_SMOKE\packages"
        $name = "FilePickerAPI-$env:BRANCH_NAME.msi"
        $env:SIGN_PATH = $builds
        ./.github/scripts/sign.ps1
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        # До подписи копии различались только exe и DLL сообщений, а
        # подпись с меткой времени сделала разными все PE-файлы при
        # одинаковых версиях. Windows Installer такие файлы при
        # обновлении не заменяет, и сверка SHA-256 со вторым MSI не
        # сошлась бы. Поэтому прочие файлы второй копии — подписанные
        # файлы первой
        $patched = 'FilePickerAPI.exe', 'FilePickerAPI.messages.dll'
        Get-ChildItem "$builds\first" -Recurse -File -Force |
          Where-Object { $_.FullName.Substring("$builds\first".Length + 1) -notin $patched } |
          ForEach-Object {
            $relative = $_.FullName.Substring("$builds\first".Length + 1)
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path "$builds\second" $relative) -Force
          }
        $install = $true
        foreach ($package in @(
            @("$builds\first", $env:MSI_VERSION_1, "$packages\first\$name"),
            @("$builds\second", $env:MSI_VERSION_2, "$packages\second\$name"),
            @("$builds\second", $env:MSI_VERSION_2, "$packages\second-rebuilt\$name"))) {
          # WiX ставится один раз на три пакета
          ./.github/scripts/build-msi.ps1 -Dist $package[0] -Branch $env:BRANCH_NAME `
            -Version $package[1] -Output $package[2] -SkipToolInstall:(-not $install)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $install = $false
        }
        $env:SIGN_PATH = $packages
        ./.github/scripts/sign.ps1
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    # Обычно несколько минут; срок — на случай зависшего msiexec или exe,
    # иначе джоб ждал бы шесть часов
    - name: MSI smoke test
      if: strategy.job-index == 0
      timeout-minutes: 30
      shell: pwsh
      env:
        BRANCH_NAME: ${{ matrix.name }}
        BRANCH_DIRECTORY: ${{ matrix.files_directory }}
      run: |
        $builds = "$env:MSI_SMOKE\builds"
        $packages = "$env:MSI_SMOKE\packages"
        $name = "FilePickerAPI-$env:BRANCH_NAME.msi"
        ./.github/scripts/msi-smoke.ps1 `
          -Msi1 "$packages\first\$name" -Build1 "$builds\first" `
          -Msi2 "$packages\second\$name" -Build2 "$builds\second" `
          -Msi2Rebuilt "$packages\second-rebuilt\$name" `
          -BuildDir dist/FilePickerAPI -FilesDirectory $env:BRANCH_DIRECTORY `
          -AppVersion $env:APP_VERSION `
          -FileVersion1 $env:MSI_VERSION_1 -FileVersion2 $env:MSI_VERSION_2 `
          -LogDir "$env:MSI_SMOKE\logs"
        exit $LASTEXITCODE

    # Журналы msiexec (/l*v) для разбора падения; копии и MSI сюда не входят
    - name: Upload MSI smoke test logs
      if: (failure() || cancelled()) && strategy.job-index == 0
      uses: actions/upload-artifact@v7
      with:
        name: msi-smoke-logs
        path: ${{ runner.temp }}/msi-smoke/logs/
        retention-days: 7

    # После дымовых проверок: в артефакт идёт только проверенная сборка
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: FilePickerAPI-${{ matrix.name }}
        path: dist/
        retention-days: 30

  # Прогоняет скрипт подписи из release.yml на этой же сборке, но с
  # одноразовым самоподписанным сертификатом: боевой сертификат доступен
  # только релизным тегам, а логику подписи нужно проверять в каждом PR.
  sign-smoke:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts

    # Сборки всех филиалов: dist/FilePickerAPI-<филиал>/FilePickerAPI
    - name: Download builds
      uses: actions/download-artifact@v8
      with:
        pattern: FilePickerAPI-*
        path: dist/

    - name: Sign with a throwaway certificate
      shell: pwsh
      env:
        TIMESTAMP_URL: http://timestamp.digicert.com
      run: |
        ./.github/scripts/throwaway-cert.ps1
        ./.github/scripts/sign.ps1
