schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Назначение
  FilePickerAPI — HTTP-сервис, который отдаёт фронтенду список .txt-файлов
  из одной заранее заданной директории (сетевой папки обмена платёжными
  файлами) и позволяет скачать файл, пригодный для импорта (.txt меньше
  10 МиБ). Запись, удаление и загрузка файлов на сервер не поддерживаются.

  ## Неизменяемые требования
  - Директория с файлами зашивается в исполняемый файл при сборке, и
    пользователь на месте не может её подменить. Не предлагать и не
    добавлять переопределение пути при запуске: переменные окружения,
    .env, аргументы (в том числе аргументы FilePickerAPI.exe), конфиги
    рядом с exe, параметры bat-файлов, значение Run в реестре, свойства
    MSI. Поэтому Settings.files_directory — ClassVar, а не поле
    настроек. Варианты
    «один exe + путь в конфиге рядом» отклоняются, даже если ускоряют
    сборку. Смена пути — только через branches.toml и новую сборку.
  - Доступ к сетевой папке с платёжками есть только у учётной записи
    пользователя (требование заказчика). Сервис работает от её имени и
    только пока пользователь в системе. Служба Windows от другой
    учётной записи, права на сетевую папку для учётных записей
    компьютеров, групп компьютеров и gMSA не допускаются; хранить пароль
    пользователя (служба или задача от его имени с паролем) тоже нельзя.

  ## Сетевые папки (Windows)
  - В филиалах директория — сетевая папка по UNC-пути; сервис ходит в
    неё с учётными данными пользователя, от имени которого запущен.
    Подключённые диски (Z:) зависят от сеанса и не всегда видны
    процессу, поэтому в branches.toml для сети — только UNC
  - Ни запрос, ни ссылки в папке не должны вести к чужим хостам (только
    к серверам самой папки: ресурс, цели DFS): иначе сервис отдал бы
    чужому хосту NTLM-хеш своей учётной записи. Поэтому fileId
    проверяется как имя до обращения к ФС, а на Windows символическим
    ссылкам сервис не следует: скачивание — lstat() по UNC-пути и
    поиск настоящего имени (FindFirstFileExW: короткие имена 8.3 и
    регистр), без resolve() (кэш разрешённого пути директории — только
    не на Windows), DFS обрабатывает SMB-клиент Windows
  - Недоступная папка — 404 (ERROR_BAD_NETPATH/ERROR_BAD_NET_NAME
    Python превращает в FileNotFoundError), сервис восстанавливается
    без перезапуска
  - Таймаута на обращения к папке нет: обработчики синхронные и идут в
    пуле потоков Starlette (40 потоков), зависшая папка может занять их
    все
  - Обращений к сетевой папке должно быть как можно меньше: один stat()
    вместо exists()+is_dir(), атрибуты из os.scandir

  ## Технологический стек
  - Python 3.11 (target-version py311), пакет `app` (`python -m app`)
  - FastAPI + Uvicorn, Pydantic v2, pydantic-settings
  - Зависимости закреплены точными версиями в pyproject.toml (кроме ruff,
    указанного как >=) — единственном источнике конфигурации (зависимости,
    pytest, ruff, setuptools-scm)
  - Версия — только из git-тега через setuptools-scm (app/_version.py
    генерируется при pip install и не хранится в git)
  - Поставка: Windows-сборка Nuitka в режиме standalone (папка с exe,
    не onefile), подписанная Authenticode в релизе; запуск из исходников
    для разработки. Docker не поддерживается
  - Основной способ установки — подписанный MSI филиала (WiX):
    C:\Program Files\FilePickerAPI\, значение FilePickerAPI в
    HKLM\Software\Microsoft\Windows\CurrentVersion\Run (запуск при
    входе любого пользователя от его имени, без окна), источник
    FilePickerAPI в журнале Application; .env с CORS_ORIGINS — в папке
    установки. Обновление — MSI новой версии (MajorUpgrade), откат и
    смена филиала той же версии — удаление и установка. Архив с
    run_test.bat и run_production.bat — до перевода филиала на MSI
    (удаление — изменение remove-bat-scripts)

  ## Структура
  - app/__init__.py — только версия пакета: импорт пакета не создаёт
    приложение и не читает настройки
  - app/api.py — create_app(): FastAPI-приложение, CORS, подключение
    роутеров; единственное место, где читаются настройки и .env
  - app/__main__.py — точка входа: только запуск без аргументов (любые
    аргументы — код 2), собранный exe переходит в свою папку
  - app/stdio.py — os.devnull вместо непригодных stdout и stderr у exe
    без консоли (на Windows поток на устройстве NUL — непригодный)
  - app/runner.py — запуск сервиса: главный поток ждёт исхода
    (остановка — 1001 и код 0, сбой — 1002 и код 1, второй экземпляр —
    1005/1006 и код 0) и завершает процесс через os._exit; рабочий
    поток: проверка второго экземпляра, create_app() (ошибка настроек —
    код 1 без повторов), создание директории в отдельном потоке (2004),
    подкласс uvicorn.Server на 0.0.0.0:8000 (буфер стартовых событий и
    1000 по server.started), повторы через 10, 30, 60 с
  - app/instance_check.py — второй экземпляр: занят ли порт (на Windows
    по таблице TCP), опрос /openapi.json через http.client без прокси,
    текст 1005/1006 с PID владельца порта
  - app/stop_signals.py — сигналы остановки: Ctrl+C через
    SetConsoleCtrlHandler на Windows, SIGINT и SIGTERM вне Windows
  - app/logging_setup.py — журнал: консоль при запуске из неё; на
    Windows файл %LOCALAPPDATA%\FilePickerAPI\logs\FilePickerAPI.log
    (ротация в полночь, хранение 30 дней) и журнал событий Application,
    если источник FilePickerAPI зарегистрирован (буфер стартовых событий)
  - app/event_tracking.py — учёт ошибок для журнала событий: коды,
    повторы (первое событие сразу, напоминания по такту таймера и при
    остановке, не больше 50 ключей на код), состояние директории
    (2000/2002/2001), медленная папка (2003), пометка учтённых исключений;
    обработчики app/handlers/files.py передают ему результат обращений
    к ФС, а create_app() регистрирует обработчики Exception и
    HTTPException — одна ошибка даёт одно событие
  - app/messages/ — таблица сообщений журнала событий (FilePickerAPI.mc)
    и ресурс версии; CI собирает из них FilePickerAPI.messages.dll
  - app/permissions.py — проверка прав на папку сборки, её содержимое и
    предков до корня тома: чистая функция find_violations над ACE,
    чтение прав через win32security (ленивый импорт), junction и
    символические ссылки в пути, текст события 1003
  - app/winapi.py — вызовы WinAPI, которых нет в pywin32, через ctypes с
    ленивой загрузкой библиотек: PID владельца порта IPv4 и IPv6
    (GetExtendedTcpTable, разбор таблиц — чистая функция над байтами),
    RegisterApplicationRestart, окно консоли (GetConsoleWindow: способ
    запуска в событии 1000) и устройство NUL
    (NtQueryVolumeInformationFile)
  - app/settings.py — настройки (pydantic-settings, кэш через lru_cache);
    путь к файлам — из app/_build_config.py (генерируется при сборке,
    не хранится в git), без него — ./files
  - branches.toml — филиалы и их директории; под каждый CI собирает
    отдельную сборку
  - scripts/branches.py — проверка branches.toml, матрица для CI
    (matrix) и запись пути филиала перед сборкой (configure <филиал>)
  - scripts/msi_version.py — перевод версии сборки (app._version.version
    или имени тега без «v») в ProductVersion MSI: первые три числа, не
    больше 255.255.65535
  - scripts/set_file_version.py — другая версия в ресурсах exe и DLL
    сообщений (UpdateResource) для дымовой проверки обновления MSI
  - installer/FilePickerAPI.wxs — пакет MSI (WiX): установка в
    C:\Program Files\FilePickerAPI\, значение Run в HKLM, постоянные
    источник событий и FilePickerAPI.messages.dll
  - .config/dotnet-tools.json — WiX, закреплённый точной версией
    (Dependabot его не обновляет)
  - app/handlers/ — роутеры; бизнес-логика файлов в app/handlers/files.py
  - tests/test_main.py — тесты API и настроек (pytest + fastapi.testclient)
  - tests/platforms.py — пометки windows_only и linux_only для тестов
  - tests/test_permissions.py — тесты проверки прав: наборы ACE, чтение
    с поддельным win32security, на Windows — папки с правами через icacls
  - tests/test_winapi.py — тесты app/winapi.py: разбор таблицы TCP и
    подмена ctypes, на Windows — настоящие вызовы
  - tests/test_branches.py — тесты branches.toml, scripts/branches.py и
    источника пути к файлам
  - tests/test_installer.py — тесты installer/FilePickerAPI.wxs как XML
    и scripts/msi_version.py; tests/script_loader.py загружает
    скрипты из scripts/ без импорта приложения;
    tests/test_set_file_version.py — тесты scripts/set_file_version.py
  - tests/test_runner.py — тесты экземпляра сервиса: запуск, второй
    экземпляр, остановка (подменённые _exit и сигналы, поддельный
    win32evtlog, настоящий Uvicorn на свободном порте)
  - tests/test_stdio.py — стандартные потоки и определение консоли,
    в том числе отдельные процессы без консоли и с ней
  - tests/test_logging_setup.py — тесты журнала (поддельные модули
    pywin32); tests/conftest.py изолирует журнал и учёт ошибок каждого
    теста
  - tests/test_event_tracking.py — тесты учёта повторов, лимита ключей и
    состояния директории на поддельных часах
  - tests/test_error_events.py — «одна ошибка — одно событие» на
    обработчиках, скачивании и настоящем Uvicorn

  ## Соглашения
  - Комментарии, docstring-и, сообщения коммитов и документация — на русском;
    тексты ошибок API (`detail`) — на английском
  - JSON-ответы в camelCase (alias_generator=to_camel)
  - ruff с select = ["ALL"]; длина строки 88, docstring/комментарии — 72;
    исключения правил описываются в pyproject.toml с комментарием-причиной
  - Покрытие тестами 100% — обязательное требование (pytest не проверяет
    порог автоматически: сверяй TOTAL в отчёте --cov-report=term-missing)
  - Ошибки возвращаются через HTTPException с осмысленным `detail`

  ## Проверки перед коммитом
  - ruff check app tests scripts
  - ruff format --check app tests scripts
  - pytest
  - openspec validate --all --strict (версия из .github/openspec:
    npm ci --prefix .github/openspec, затем
    npm exec --prefix .github/openspec -- openspec validate --all --strict)

  ## CI/CD
  - .github/workflows/build-exe.yml: ruff + pytest на Ubuntu и pytest на
    Windows (test-windows: проверки только для Windows, в том числе на
    отдельном SMB-ресурсе раннера — TestSmbShare), параллельно с ними
    сборка Nuitka на Windows под каждый филиал из branches.toml
    (временные артефакты untested-FilePickerAPI-<филиал> на день),
    затем, после тестов и всех сборок, параллельно публикация
    артефактов FilePickerAPI-<филиал> (publish) и пробная подпись
    временных артефактов одноразовым сертификатом (sign-smoke,
    .github/scripts/sign.ps1). На первом филиале джоб build проверяет
    запуск (startup-smoke.ps1) и MSI: две копии сборки вне dist/
    (вторая — с версией на единицу больше, scripts/set_file_version.py),
    подписанные одноразовым сертификатом (throwaway-cert.ps1), из них
    MSI (WiX из .config/dotnet-tools.json, .github/scripts/build-msi.ps1)
    и дымовая проверка .github/scripts/msi-smoke.ps1 (установка,
    события, обновление, откат, удаление; общие функции —
    smoke-common.ps1). Этот MSI в артефакт и релиз не идёт, dist/
    остаётся неподписанным
  - .github/workflows/release.yml: по тегу vX.Y.Z из цифр собирает,
    проверяет зависимости (audit.yml), подписывает в окружении
    code-signing (sign), собирает из подписанных папок MSI каждого
    филиала тем же build-msi.ps1 в джобе msi без окружения и секретов
    (версия — имя тега без «v»), подписывает только MSI в code-signing
    (sign-msi, проверяет, что в артефакте только MSI) и публикует
    FilePickerAPI-<филиал>.zip и FilePickerAPI-<филиал>.msi для
    каждого филиала
  - .github/workflows/audit.yml: pip-audit всех установленных зависимостей
    на Windows (push, PR, ежедневно; вызывается из release.yml перед
    подписью)
  - build-exe.yml и audit.yml не запускаются по push и PR, если
    изменена только документация (paths-ignore: **.md, openspec/**,
    .claude/**, .github/openspec/**); для неё .github/workflows/docs.yml
    на Ubuntu запускает openspec validate --all --strict (openspec
    закреплён в .github/openspec/package-lock.json); отдельный джоб
    npm-audit там же проверяет пакеты openspec раз в три дня, вручную
    и в push/PR с изменениями .github/openspec. О падении планового
    запуска GitHub пишет только автору последней правки cron, поэтому
    падения смотреть в Actions и по бейджам.
    Совпадение списков путей в трёх файлах проверяет
    tests/test_workflows.py
  - .github/dependabot.yml: еженедельные обновления pip, GitHub Actions
    и npm (.github/openspec)

rules:
  proposal:
    - Явно указывай, меняется ли контракт HTTP API (поля, коды ответов, тексты detail)
    - Перечисляй, что остаётся вне рамок изменения
    - Не предлагай способов задать директорию с файлами при запуске (см. «Неизменяемые требования»)
  design:
    - Учитывай работу на Windows с сетевыми (UNC) путями и разницу Python 3.11 (сборка, CI) и новее
    - Проверяй, что изменение не добавляет обращений к хостам, кроме хоста настроенной папки, и лишних запросов к сетевой папке (см. «Сетевые папки (Windows)»)
  tasks:
    - Включай задачи на тесты, сохраняющие 100% покрытие
    - Включай задачу на обновление README.md, если меняется API или конфигурация
    - Последняя задача — прогон ruff check, ruff format --check (app tests scripts) и pytest
