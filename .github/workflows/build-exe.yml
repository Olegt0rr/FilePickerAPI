name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run ruff checks
      run: |
        ruff check app tests scripts
        ruff format --check app tests scripts
    
    - name: Read branch list from branches.toml
      id: matrix
      run: |
        matrix="$(python scripts/branches.py matrix)"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
    
    - name: Run tests with coverage
      run: |
        pytest
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7

  build:
    name: build (${{ matrix.name }})
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.matrix) }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller
    
    - name: Configure files directory for branch ${{ matrix.name }}
      env:
        BRANCH_NAME: ${{ matrix.name }}
      run: |
        python scripts/branches.py configure "$env:BRANCH_NAME"
    
    - name: Verify files directory for branch ${{ matrix.name }}
      shell: python
      env:
        EXPECTED_DIRECTORY: ${{ matrix.files_directory }}
      run: |
        import os
        from app.settings import get_settings

        actual = get_settings().files_directory
        expected = os.environ["EXPECTED_DIRECTORY"]
        print("files_directory =", actual)
        assert actual == expected, f"expected {expected!r}, got {actual!r}"
    
    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --name FilePickerAPI --hidden-import app._build_config --add-data "app;app" app/__main__.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FilePickerAPI-${{ matrix.name }}
        path: dist/FilePickerAPI.exe
        retention-days: 30
