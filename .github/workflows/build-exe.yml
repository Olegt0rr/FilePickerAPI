name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run ruff checks
      run: |
        ruff check app tests
        ruff format --check app tests
    
    - name: Run tests with coverage
      run: |
        pytest
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7

  build:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[build]

    # Кэш Nuitka (скомпилированные C-модули, скачанные утилиты): без него
    # каждый push/PR заново компилирует всё дерево зависимостей.
    - name: Cache Nuitka
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Nuitka\Nuitka\Cache
        key: nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: nuitka-${{ runner.os }}-

    - name: Build executable with Nuitka
      shell: pwsh
      run: |
        $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
        python -m nuitka `
          --mode=standalone `
          --msvc=latest `
          --assume-yes-for-downloads `
          --remove-output `
          --output-dir=build `
          --output-folder-name=FilePickerAPI `
          --output-filename=FilePickerAPI.exe `
          --include-package=app `
          --include-package=uvicorn `
          --product-name=FilePickerAPI `
          --file-description="File Picker API" `
          --file-version=$version `
          --product-version=$version `
          app/__main__.py
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force dist | Out-Null
        Move-Item build/FilePickerAPI.dist dist/FilePickerAPI
        Copy-Item run_test.bat, run_production.bat dist/FilePickerAPI/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FilePickerAPI-Windows
        path: dist/
        retention-days: 30
